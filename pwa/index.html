<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>all-zeroes</title>
<link rel="manifest" href="manifest.json">
<meta name="theme-color" content="#ffffff" id="meta-theme-color">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg: #ffffff;
  --surface: #fafafa;
  --card: #ffffff;
  --border: #eaeaea;
  --text: #000000;
  --muted: #666666;
  --primary: #000000;
  --primary-hover: #333333;
  --primary-text: #ffffff;
  --radius: 6px;
  --header-height: 64px;
}

[data-theme="dark"] {
  --bg: #000000;
  --surface: #0a0a0a;
  --card: #000000;
  --border: #333333;
  --text: #ffffff;
  --muted: #888888;
  --primary: #ffffff;
  --primary-hover: #cccccc;
  --primary-text: #000000;
}

body {
  font-family: 'Poppins', sans-serif;
  font-size: 14px;
  background: var(--bg);
  color: var(--text);
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  line-height: 1.6;
  transition: background-color 0.2s, color 0.2s;
}

/* ── Header ── */
header {
  background: var(--bg);
  border-bottom: 1px solid var(--border);
  padding: 0 24px;
  display: flex;
  align-items: center;
  gap: 32px;
  height: var(--header-height);
  flex-shrink: 0;
  position: sticky;
  top: 0;
  z-index: 10;
  transition: background-color 0.2s, border-color 0.2s;
}
header h1 {
  font-size: 18px;
  font-weight: 600;
  letter-spacing: -0.03em;
  color: var(--text);
  white-space: nowrap;
}

.header-actions {
  display: flex;
  align-items: center;
  gap: 8px;
}

.icon-btn {
  background: none;
  border: none;
  color: var(--text);
  cursor: pointer;
  font-size: 18px;
  padding: 8px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: var(--radius);
  transition: background 0.2s;
}
.icon-btn:hover { background: var(--surface); }

#sse-dot {
  width: 10px; height: 10px; border-radius: 50%;
  border: 2px solid var(--muted); flex-shrink: 0;
  transition: border-color 0.3s, background-color 0.3s;
  margin-left: 8px;
}
#sse-dot.connected { border-color: var(--text); background-color: var(--text); }
#sse-dot.disconnected { border-color: var(--text); background-color: transparent; }

/* ── Main layout ── */
main {
  flex: 1;
  max-width: 840px;
  width: 100%;
  margin: 0 auto;
  padding: 48px 24px 100px 24px; /* padding-bottom to clear FAB */
}

/* ── Toast ── */
#toast {
  position: fixed;
  bottom: 24px;
  left: 24px; /* Move to left so it doesn't overlap FAB */
  background: var(--text);
  color: var(--bg);
  border-radius: var(--radius);
  padding: 12px 20px;
  font-size: 14px;
  font-weight: 500;
  transform: translateY(100px);
  opacity: 0;
  transition: transform 0.3s cubic-bezier(0.16, 1, 0.3, 1), opacity 0.3s;
  z-index: 100;
  pointer-events: none;
}
#toast.show { transform: translateY(0); opacity: 1; }
#toast.error { background: var(--bg); color: var(--text); border: 1px solid var(--text); }

/* ── Job cards ── */
.job-card {
  background: var(--card);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  padding: 24px;
  margin-bottom: 16px;
  transition: border-color 0.2s;
}
.job-card:hover { border-color: var(--muted); }
.job-card.status-done { opacity: 0.6; }
.job-card.status-done:hover { opacity: 1; }

.job-header {
  display: flex;
  align-items: center;
  gap: 16px;
  margin-bottom: 8px;
}
.job-filename {
  font-weight: 600;
  font-size: 16px;
  flex: 1;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.badge {
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.05em;
  padding: 4px 10px;
  border-radius: 999px;
  white-space: nowrap;
  flex-shrink: 0;
  border: 1px solid var(--border);
  text-transform: uppercase;
}
.badge.done { border-color: var(--text); color: var(--text); }
.badge.failed { border-style: dashed; border-color: var(--text); }
.badge.acquiring, .badge.staged, .badge.delivering { background: var(--surface); }

.job-meta { color: var(--muted); font-size: 13px; margin-bottom: 16px; }

/* Progress bar */
.progress-bar {
  height: 2px;
  background: var(--border);
  border-radius: 2px;
  margin-bottom: 16px;
  overflow: hidden;
}
.progress-fill {
  height: 100%;
  background: var(--text);
  transition: width 0.4s ease;
}

/* Chunk action area */
.chunk-action {
  background: var(--surface);
  border-radius: var(--radius);
  padding: 16px;
  display: flex;
  align-items: center;
  gap: 12px;
  flex-wrap: wrap;
  border: 1px solid var(--border);
}
.chunk-label { flex: 1; font-size: 13px; color: var(--text); min-width: 120px; }


/* Concat command */
.concat-box {
  margin-top: 16px;
  padding: 16px;
  border: 1px solid var(--border);
  border-radius: var(--radius);
}
.concat-box p { font-size: 13px; color: var(--muted); margin-bottom: 12px; }
.concat-cmd {
  display: flex;
  align-items: flex-start;
  gap: 12px;
}
.concat-cmd code {
  flex: 1;
  font-family: 'SF Mono', 'Fira Code', monospace;
  font-size: 13px;
  color: var(--text);
  background: var(--surface);
  padding: 12px 16px;
  border-radius: var(--radius);
  white-space: pre-wrap;
  word-break: break-all;
  border: 1px solid var(--border);
}

/* Error message */
.job-error { font-size: 13px; margin-top: 8px; font-family: monospace; border-left: 2px solid var(--text); padding-left: 8px; }

/* Empty state */
.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--muted);
}
.empty-state p { margin-bottom: 16px; font-size: 15px; }

/* Archive section */
.archive-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 0;
  margin: 8px 0 4px;
  cursor: pointer;
  font-size: 13px;
  font-weight: 500;
  color: var(--muted);
  border-top: 1px solid var(--border);
  user-select: none;
}
.archive-header:hover { color: var(--text); }
.archive-chevron { font-size: 10px; }

/* Disk gauge */
.disk-gauge {
  font-size: 12px;
  color: var(--muted);
  white-space: nowrap;
}
.disk-gauge.low { color: var(--text); font-weight: 600; }

/* ── FAB ── */
.fab {
  position: fixed;
  bottom: 32px;
  right: 32px;
  width: 64px;
  height: 64px;
  border-radius: 32px;
  background: var(--text);
  color: var(--bg);
  border: 1px solid var(--border);
  font-size: 28px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  transition: transform 0.2s, background 0.2s;
  z-index: 50;
}
.fab:hover { transform: scale(1.05); }

/* ── Modals ── */
.modal-overlay {
  position: fixed;
  top: 0; left: 0; right: 0; bottom: 0;
  background: rgba(0, 0, 0, 0.6);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 100;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.2s;
}
.modal-overlay.open {
  opacity: 1;
  pointer-events: auto;
}
.modal-content {
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  width: 100%;
  max-width: 500px;
  max-height: 90vh;
  overflow-y: auto;
  padding: 32px;
  transform: translateY(20px);
  transition: transform 0.2s;
  position: relative;
}
.modal-overlay.open .modal-content {
  transform: translateY(0);
}
.modal-close {
  position: absolute;
  top: 16px;
  right: 16px;
  background: none;
  border: none;
  font-size: 20px;
  cursor: pointer;
  color: var(--muted);
}
.modal-close:hover { color: var(--text); }


/* ── Forms ── */
.form-section { margin-bottom: 32px; max-width: 600px; }
.form-section h2 { font-size: 20px; font-weight: 600; margin-bottom: 24px; letter-spacing: -0.02em; }

label {
  display: block;
  font-size: 13px;
  font-weight: 500;
  color: var(--text);
  margin-bottom: 8px;
}
input[type=text], input[type=url], input[type=password], select {
  width: 100%;
  background: var(--bg);
  border: 1px solid var(--border);
  border-radius: var(--radius);
  color: var(--text);
  padding: 12px 16px;
  font-size: 14px;
  font-family: inherit;
  outline: none;
  margin-bottom: 20px;
  transition: border-color 0.2s;
}
input:focus, select:focus { border-color: var(--text); }
select option { background: var(--bg); color: var(--text); }

.toggle-row {
  display: flex;
  align-items: center;
  gap: 12px;
  margin-bottom: 24px;
}
.toggle-row label { margin: 0; font-size: 14px; color: var(--text); font-weight: 400; }
.toggle-row input[type="checkbox"] {
  accent-color: var(--text);
  width: 16px;
  height: 16px;
}

/* ── Buttons ── */
.btn {
  display: inline-flex;
  align-items: center;
  justify-content: center;
  gap: 8px;
  padding: 10px 18px;
  border-radius: var(--radius);
  border: 1px solid var(--primary);
  cursor: pointer;
  font-size: 14px;
  font-weight: 500;
  font-family: inherit;
  transition: all 0.2s;
  white-space: nowrap;
  text-decoration: none;
  background: var(--primary);
  color: var(--primary-text);
}
.btn:disabled { opacity: 0.5; cursor: not-allowed; }
.btn-primary:hover:not(:disabled) { background: var(--primary-hover); border-color: var(--primary-hover); }

.btn-sm { padding: 6px 12px; font-size: 13px; }
.btn-ghost {
  background: transparent;
  color: var(--text);
  border: 1px solid var(--border);
}
.btn-ghost:hover:not(:disabled) { border-color: var(--text); background: var(--surface); color: var(--text); }

/* Success action buttons */
.btn-success {
  background: var(--text);
  color: var(--bg);
  border-color: var(--text);
}

.hint { font-size: 13px; color: var(--muted); margin-bottom: 24px; }
</style>
</head>
<body>

<header>
  <h1>all-zeroes</h1>
  <div style="flex: 1;"></div>
  <div class="header-actions">
    <button class="icon-btn" onclick="openModal('settings')" title="Settings">
      <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3"></circle>
        <path d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"></path>
      </svg>
    </button>
    <button class="icon-btn" id="theme-toggle" onclick="toggleTheme()" title="Toggle theme">
      <svg id="theme-icon" width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="5"></circle>
        <line x1="12" y1="1" x2="12" y2="3"></line>
        <line x1="12" y1="21" x2="12" y2="23"></line>
        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line>
        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line>
        <line x1="1" y1="12" x2="3" y2="12"></line>
        <line x1="21" y1="12" x2="23" y2="12"></line>
        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line>
        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>
      </svg>
    </button>
    <span id="disk-gauge" class="disk-gauge"></span>
    <div id="sse-dot" title="SSE connection status"></div>
  </div>
</header>

<main>
  <div id="jobs-list">
    <div class="empty-state"><p>Connecting…</p></div>
  </div>
</main>

<button class="fab" onclick="openModal('submit')" title="New Job">
  <svg width="24" height="24" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
    <line x1="12" y1="5" x2="12" y2="19"></line>
    <line x1="5" y1="12" x2="19" y2="12"></line>
  </svg>
</button>

<!-- Submit Modal -->
<div id="modal-submit" class="modal-overlay" onclick="closeModal(event, 'submit')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal(null, 'submit')">✕</button>
    <div class="form-section" style="margin-bottom: 0; max-width: none;">
      <h2>New Download Job</h2>
      <label for="f-url">URL *</label>
      <input id="f-url" type="url" placeholder="https://example.com/file.zip" autocomplete="off" oninput="probeURLDebounced()">
      <div id="probe-result" class="hint" style="display:none;margin-top:-12px;margin-bottom:16px;"></div>

      <label for="f-filename">Filename Override</label>
      <input id="f-filename" type="text" placeholder="Leave blank to auto-detect">

      <label for="f-referer">Referer</label>
      <input id="f-referer" type="url" placeholder="https://example.com/">

      <label for="f-ua">User-Agent</label>
      <input id="f-ua" type="text" placeholder="Leave blank to use default">

      <label for="f-stage">Stage</label>
      <select id="f-stage">
        <option value="vps" selected>VPS (download to server first)</option>
        <option value="stream">Stream (source → Nextcloud, no disk)</option>
        <option value="gdrive">GDrive (owner only — archive to Drive)</option>
      </select>

      <div class="toggle-row">
        <input type="checkbox" id="f-deliver-now" checked>
        <label for="f-deliver-now">Deliver now (start chunking immediately after download)</label>
      </div>

      <p class="hint">Using backend: <span id="hint-backend">—</span></p>
      <button class="btn btn-primary" style="width: 100%" onclick="submitJob()">Submit Job</button>
    </div>
  </div>
</div>

<!-- Settings Modal -->
<div id="modal-settings" class="modal-overlay" onclick="closeModal(event, 'settings')">
  <div class="modal-content" onclick="event.stopPropagation()">
    <button class="modal-close" onclick="closeModal(null, 'settings')">✕</button>
    <div class="form-section" style="margin-bottom: 0; max-width: none;">
      <h2>Settings</h2>
      <p class="hint">Preferences are saved locally on this device.</p>

      <label for="s-backend">Backend URL</label>
      <input id="s-backend" type="url" placeholder="https://api.example.com">

      <label for="s-apikey">API Key</label>
      <input id="s-apikey" type="text" placeholder="Your bearer token">

      <label for="s-ncurl">Nextcloud WebDAV URL</label>
      <input id="s-ncurl" type="url" placeholder="https://nc.example.com/public.php/webdav">

      <label for="s-nctoken">Nextcloud Share Token</label>
      <input id="s-nctoken" type="text" placeholder="Token string">

      <div class="toggle-row">
        <input type="checkbox" id="s-owner">
        <label for="s-owner">I am the owner (enables GDrive actions)</label>
      </div>

      <button class="btn btn-primary" style="width: 100%" onclick="saveSettings()">Save Settings</button>
      <div style="display:flex;gap:8px;margin-top:12px;">
        <button class="btn btn-ghost" style="flex:1" onclick="exportSettings()">Export JSON</button>
        <label class="btn btn-ghost" style="flex:1;cursor:pointer">
          Import JSON
          <input type="file" id="s-import-file" accept=".json,application/json,text/plain" style="display:none" onchange="importSettingsFile(event)">
        </label>
      </div>
    </div>
  </div>
</div>

<div id="toast"></div>

<script>
  const SUN_ICON = '<circle cx="12" cy="12" r="5"></circle><line x1="12" y1="1" x2="12" y2="3"></line><line x1="12" y1="21" x2="12" y2="23"></line><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"></line><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"></line><line x1="1" y1="12" x2="3" y2="12"></line><line x1="21" y1="12" x2="23" y2="12"></line><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"></line><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"></line>';
  const MOON_ICON = '<path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"></path>';
  const AUTO_ICON = '<rect x="2" y="3" width="20" height="14" rx="2"></rect><line x1="8" y1="21" x2="16" y2="21"></line><line x1="12" y1="17" x2="12" y2="21"></line>';

  function setTheme(stored) {
    // stored is 'light', 'dark', or null/'auto' (follow system)
    const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
    const resolved = (stored === 'light' || stored === 'dark') ? stored : (prefersDark ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', resolved);
    document.getElementById('meta-theme-color').setAttribute('content', resolved === 'dark' ? '#000000' : '#ffffff');
    const icon = document.getElementById('theme-icon');
    if (stored === 'light') icon.innerHTML = SUN_ICON;
    else if (stored === 'dark') icon.innerHTML = MOON_ICON;
    else icon.innerHTML = AUTO_ICON;
    document.getElementById('theme-toggle').title = stored === 'light' ? 'Theme: light' : stored === 'dark' ? 'Theme: dark' : 'Theme: auto (system)';
  }

  function toggleTheme() {
    const stored = localStorage.getItem('theme'); // null | 'light' | 'dark'
    const next = stored === null ? 'light' : stored === 'light' ? 'dark' : null;
    if (next === null) localStorage.removeItem('theme'); else localStorage.setItem('theme', next);
    setTheme(next);
  }

  // React to system preference changes when in auto mode
  window.matchMedia('(prefers-color-scheme: dark)').addEventListener('change', () => {
    if (!localStorage.getItem('theme')) setTheme(null);
  });

  setTheme(localStorage.getItem('theme'));
</script>
<script src="app.js"></script>
</body>
</html>
