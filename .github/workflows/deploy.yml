name: Deploy backend

on:
  workflow_dispatch:
    inputs:
      arch:
        description: 'Target architecture (amd64 or arm64)'
        required: true
        default: 'amd64'
        type: choice
        options:
          - amd64
          - arm64

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.22'

      - name: Build
        working-directory: backend
        run: GOOS=linux GOARCH=${{ github.event.inputs.arch }} CGO_ENABLED=0 go build -o zerorated ./cmd/server

      - name: Copy binary
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          source: backend/zerorated
          target: /tmp/

      - name: Restart service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.VPS_HOST }}
          username: ${{ secrets.VPS_USER }}
          key: ${{ secrets.VPS_SSH_KEY }}
          script: |
            sudo mv /tmp/backend/zerorated /opt/zerorated/server
            sudo chmod +x /opt/zerorated/server
            sudo systemctl restart zerorated
            systemctl is-active zerorated
